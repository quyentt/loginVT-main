<script>
    (function () {
        var strTen = '';
        try {
            strTen = ($('#lblHoTenNguoiDangNhap').text() || '').trim();
            if (!strTen) {
                strTen = ($('.nav-account .dropdown button .user-image').first()
                    .parent().find('> span').first().text() || '').trim();
            }
        } catch (e) {}
        var now = new Date();
        var iGio = parseInt(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', hour12: false }), 10);
        var strChao = (iGio >= 5 && iGio < 11) ? 'Chào buổi sáng'
                    : (iGio >= 11 && iGio < 13) ? 'Chào buổi trưa'
                    : (iGio >= 13 && iGio < 18) ? 'Chào buổi chiều'
                    : (iGio >= 18 && iGio < 22) ? 'Chào buổi tối'
                    : 'Chào buổi đêm';
        var arrThu = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        var strNgay = arrThu[now.getDay()] + ', ngày ' + now.getDate().toString().padStart(2, '0')
                    + '/' + (now.getMonth() + 1).toString().padStart(2, '0') + '/' + now.getFullYear();
        var elHello = document.getElementById('dbHeroHello');
        var elName = document.getElementById('dbHeroName');
        var elDate = document.querySelector('#dbHeroDate span');
        if (elHello) elHello.textContent = strChao + ',';
        if (elName) elName.textContent = strTen || 'Sinh viên';
        if (elDate) elDate.textContent = strNgay;
    })();
</script>
