<!-- page script -->
<script src="modules/danhmucheso/scripts/DanhMucNganHang.js?v=1.0.0.2"></script>
<script type="text/javascript">
    var main_doc = {};
    main_doc['DanhMucNganHang'] = new DanhMucNganHang();
    $(document).ready(function () {
        main_doc.DanhMucNganHang.init();

        // FIX 2026-08-26: Thay pattern reposition cu (khong on dinh) bang re-init
        // select2 voi dropdownParent = modal — popup nam trong modal, khong bi
        // global observer o indexi.aspx dam vao.
        $(document).on('shown.bs.modal', '.modal', function () {
            var $modal = $(this);
            $modal.find('select.select-opt, select[id^="drop"]').each(function () {
                var $sel = $(this);
                try {
                    if ($sel.hasClass('select2-hidden-accessible')) $sel.select2('destroy');
                } catch (e) {}
                $sel.select2({ dropdownParent: $modal, width: '100%' });
            });
        });
    });
</script>
<style>
    .modal .select2-container--open,
    .modal .select2-container--open .select2-dropdown {
        z-index: 100060 !important;
    }
    .modal .select2-results__options {
        max-height: 220px !important;
        overflow-y: auto !important;
    }
</style>
