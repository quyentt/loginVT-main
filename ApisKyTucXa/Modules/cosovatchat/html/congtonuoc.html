<!-- nạp giao diện chung KTX. Bộ nạp trang (loadPage) chỉ tự thêm thư mục ứng dụng cho thẻ nhúng file js, không thêm cho thẻ nhúng css,
     nên đường dẫn được dựng bằng edu.system.appCode (cùng quy ước với file js của trang) -->
<script type="text/javascript">
    (function () {
        if (document.getElementById('ktx-ui-css')) return;
        var l = document.createElement('link');
        l.id = 'ktx-ui-css';
        l.rel = 'stylesheet';
        l.href = ((window.edu && edu.system && edu.system.appCode) ? edu.system.appCode + '/' : '') + 'modules/common/ktx-ui.css?v=1.0.1.0';
        document.head.appendChild(l);
    })();
</script>

<!-- FIX 2026-08-26: Select2 trong modal — re-init voi dropdownParent = modal
     de popup nam trong modal, khong lech / che noi dung. Universal handler,
     an toan khi modal khong co select. -->
<script>
(function () {
    if (typeof jQuery === 'undefined') return;
    var $ = jQuery;
    $(document).off('shown.bs.modal.__s2fix').on('shown.bs.modal.__s2fix', '.modal', function () {
        var $modal = $(this);
        $modal.find('select.select-opt, select[id^="drop"]').each(function () {
            var $sel = $(this);
            try {
                if ($sel.hasClass('select2-hidden-accessible')) $sel.select2('destroy');
            } catch (e) {}
            $sel.select2({ dropdownParent: $modal, width: '100%' });
        });
    });
})();
</script>
<style>
    .modal .select2-container--open,
    .modal .select2-container--open .select2-dropdown {
        z-index: 100060 !important;
    }
    .modal .select2-results__options {
        max-height: 220px !important;
        overflow-y: auto !important;
    }
</style>
